snapshots:
  - name: points_scoring_system_snapshot
    description: "Historial del reglamento de puntos (seed points_scoring_system). Si cambia la puntuación de una regla (por ejemplo, se elimina el punto de vuelta rápida), se cierra la versión anterior (dbt_valid_to) y se abre la nueva. La versión vigente tiene dbt_valid_to nulo. Permite saber con qué reglamento se validaron los puntos del origen en cada carga."
    relation: ref('points_scoring_system')
    config:
      unique_key: scoring_rule_id
      strategy: check
      check_cols: [points, fastest_lap_bonus]
      hard_deletes: new_record