version: 2

sources:
  - name: f1
    description: >
      Datos históricos de la Fórmula 1 (dataset de Kaggle)
    database: "{{ env_var('DBT_BRONZE_DB') }}"
    schema: f1

    tables:
      - name: circuits
        description: "Circuitos donde se han disputado carreras"
        columns:
          - name: circuitId
            description: "Identificador del circuito"
          - name: circuitRef
            description: "Nombre corto del circuito"
          - name: name
            description: "Nombre oficial del circuito"
          - name: location
            description: "Localidad del circuito"
          - name: country
            description: "País del circuito."
          - name: lat
            description: "Latitud en grados."
          - name: lng
            description: "Longitud en grados."
          - name: alt
            description: "Altitud en metros."
          - name: url
            description: "Enlace de Wikipedia del circuito."
          - name: _loaded_at
            description: "Momento en que la fila llegó a Bronze; la rellena Snowflake al cargar."

      - name: constructors
        description: "Constructores (escuderias) que han participado."
        columns:
          - name: constructorId
            description: "Identificador del contructor."
          - name: constructorRef
            description: "Nombre corto del contructor."
          - name: name
            description: "Nombre del contructor."
          - name: nationality
            description: "Nacionalidad del contructor."
          - name: url
            description: "Enlace de Wikipedia del contructor."
          - name: _loaded_at
            description: "Momento en que la fila llegó a Bronze; la rellena Snowflake al cargar."

      - name: drivers
        description: "Pilotos que han participado."
        columns:
          - name: driverId
            description: "Identificador del piloto."
          - name: driverRef
            description: "Nombre corto del piloto."
          - name: number
            description: "Número permanente elegido por el piloto (sistema vigente desde 2014); el último usado si se ha retirado. Vacío en pilotos anteriores."
          - name: code
            description: "Código de tres letras del piloto."
          - name: forename
            description: "Nombre del piloto."
          - name: surname
            description: "Apellido del piloto."
          - name: dob
            description: "Fecha de nacimiento."
          - name: nationality
            description: "Nacionalidad del piloto."
          - name: url
            description: "Enlace de Wikipedia del piloto."
          - name: _loaded_at
            description: "Momento en que la fila llegó a Bronze; la rellena Snowflake al cargar."

      - name: races
        description: "Carreras disputadas, una fila por gran premio."
        columns:
          - name: raceId
            description: "Identificador de la carrera."
          - name: year
            description: "Año de temporada."
          - name: round
            description: "Número de la carrera dentro de la temporada."
          - name: circuitId
            description: "Circuito donde se disputó."
          - name: name
            description: "Nombre del gran premio."
          - name: date
            description: "Fecha de la carrera."
          - name: time
            description: "Hora de la carrera (texto); vacío en carreras antiguas."
          - name: url
            description: "Enlace de Wikipedia de la carrera."
          - name: fp1_date
            description: "Fecha de la primera sesión de entrenamientos libres."
          - name: fp1_time
            description: "Hora de la primera sesión de entrenamientos libres (texto)."
          - name: fp2_date
            description: "Fecha de la segunda sesión de entrenamientos libres."
          - name: fp2_time
            description: "Hora de la segunda sesión de entrenamientos libres (texto)."
          - name: fp3_date
            description: "Fecha de la tercera sesión de entrenamientos libres."
          - name: fp3_time
            description: "Hora de la tercera sesión de entrenamientos libres (texto)."
          - name: quali_date
            description: "Fecha de la clasificación."
          - name: quali_time
            description: "Hora de la clasificación (texto)."
          - name: sprint_date
            description: "Fecha de la carrera sprint, en caso de haberse disputado."
          - name: sprint_time
            description: "Hora de la carrera sprint (texto)."
          - name: _loaded_at
            description: "Momento en que la fila llegó a Bronze; la rellena Snowflake al cargar."

      - name: status
        description: "Catálogo de estados con los que termina (o no) un piloto una carrera."
        columns:
          - name: statusId
            description: "Identificador del estado."
          - name: status
            description: "Descripción del estado."
          - name: _loaded_at
            description: "Momento en que la fila llegó a Bronze; la rellena Snowflake al cargar."

      - name: qualifying
        description: "Resultados de clasificación, una fila por piloto y carrera."
        columns:
          - name: qualifyId
            description: "Identificador de la fila de clasificación."
          - name: raceId
            description: "Carrera a la que pertenece."
          - name: driverId
            description: "Piloto."
          - name: constructorId
            description: "Equipo con el que corrió."
          - name: number
            description: "Dorsal con el que corrió."
          - name: position
            description: "Posición final en la clasificación."
          - name: q1
            description: "Mejor tiempo en la Q1 (texto)."
          - name: q2
            description: "Mejor tiempo en la Q2 (texto)."
          - name: q3
            description: "Mejor tiempo en la Q3 (texto)."
          - name: _loaded_at
            description: "Momento en que la fila llegó a Bronze; la rellena Snowflake al cargar."

      - name: results
        description: "Resultados de carrera, una fila por piloto y carrera."
        columns:
          - name: resultId
            description: "Identificador del resultado."
          - name: raceId
            description: "Carrera a la que pertenece."
          - name: driverId
            description: "Piloto."
          - name: constructorId
            description: "Escudería para la que corrió."
          - name: number
            description: "Dorsal con el que corrió."
          - name: grid
            description: "Posición de salida; 0 cuando no hay posición de parrilla."
          - name: position
            description: "Posición final; vacía si el piloto no fue clasificado."
          - name: positionText
            description: "Posición como texto; una letra (R, D, W, N, F, E) si no fue clasificado."
          - name: positionOrder
            description: "Orden final de la carrera, incluyendo a los no clasificaods."
          - name: points
            description: "Puntos obtenidos."
          - name: laps
            description: "Vueltas completadas."
          - name: time
            description: "Tiempo total o diferencia con el ganador (texto)."
          - name: milliseconds
            description: "Tiempo total en milisegundos."
          - name: fastestLap
            description: "Número de la vuelta más rápida del piloto."
          - name: rank
            description: "Posición del piloto en el ranking de vueltas rápidas de la carrera."
          - name: fastestLapTime
            description: "Tiempo de su vuelta más rápida (texto)."
          - name: fastestLapSpeed
            description: "Velocidad media en su vuelta más rápida."
          - name: statusId
            description: "Estado con el que terminó, referencia a status."
          - name: _loaded_at
            description: "Momento en que la fila llegó a Bronze; la rellena Snowflake al cargar."

      - name: sprint_results
        description: "Resultados de las carreras sprint (solo desde 2021)."
        columns:
          - name: resultId
            description: "Identificador del resultado de sprint."
          - name: raceId
            description: "Carrera a la que pertenece."
          - name: driverId
            description: "Piloto."
          - name: constructorId
            description: "Escuderia con la que corrió."
          - name: number
            description: "Dorsal con el que corrió."
          - name: grid
            description: "Posición de salida del sprint."
          - name: position
            description: "Posición final del sprint; vacía si no fue clasificado."
          - name: positionText
            description: "Posición como texto; una letra si no fue clasificado."
          - name: positionOrder
            description: "Orden final del sprint, incluyendo a los no clasificados."
          - name: points
            description: "Puntos del sprint."
          - name: laps
            description: "Vueltas completadas."
          - name: time
            description: "Tiempo total o diferencia con el ganador (texto)."
          - name: milliseconds
            description: "Tiempo total en milisegundos."
          - name: fastestLap
            description: "Número de la vuelta más rápida del piloto."
          - name: fastestLapTime
            description: "Tiempo de su vuelta más rápida (texto)."
          - name: statusId
            description: "Estado con el que terminó, referencia a status."
          - name: _loaded_at
            description: "Momento en que la fila llegó a Bronze; la rellena Snowflake al cargar."