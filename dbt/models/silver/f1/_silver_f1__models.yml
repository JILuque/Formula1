        arguments:
          to: ref('slv_f1__races')
          field: id_race
  - name: id_driver
    description: "Clave del piloto: clave sustituta de su referencia."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('slv_f1__drivers')
          field: id_driver
  - name: id_constructor
    description: "Clave del constructor: clave sustituta de su referencia."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('slv_f1__constructors')
          field: id_constructor
  - name: season_year
    description: "Año de la temporada."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: '{{ var(''season_start'') }}'
          max_value: '{{ var(''season_end'') }}'
  - name: round
    description: "Número de ronda dentro de la temporada."
  - name: car_number
    description: "Número de coche en la carrera. Nulo si no consta."
  - name: position
    description: "Posición oficial. Nulo si no fue clasificado."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
  - name: q1_ms
    description: "Mejor tiempo de la Q1 en milisegundos. Nulo si el valor no se pudo convertir."
  - name: q2_ms
    description: "Mejor tiempo de la Q2 en milisegundos."
  - name: q3_ms
    description: "Mejor tiempo de la Q3 en milisegundos."
- name: slv_f1__sprint_results
