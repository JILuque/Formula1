version: 2

models:
- name: fct_driver_season
  description: "Tabla de hechos con el score compuesto de cada piloto y temporada (2000-2024). Una fila por piloto y temporada. Reúne C1 (duelo con el compañero), C2 (incidentes del piloto) y C3 (rendimiento frente al coche). El score es nulo si la muestra no es fiable."
  config:
    contract:
      enforced: true
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id_driver
        - season_year
  columns:
  - name: id_driver_season
    description: "Clave de la fila: clave sustituta de piloto y temporada."
    data_type: varchar(32)
    constraints:
    - type: not_null
    data_tests:
    - unique
    - not_null
  - name: id_driver
    description: "Piloto. Apunta a dim_driver."
    data_type: varchar(32)
    constraints:
    - type: not_null
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_driver')
          field: id_driver
  - name: season_year
    description: '{{ doc("season_year") }}'
    data_type: number(4,0)
    constraints:
    - type: not_null
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: '{{ var(''season_start'') }}'
          max_value: '{{ var(''season_end'') }}'
  - name: n_races
    description: "Carreras en las que tomó la salida (excluye not_started)."
    data_type: number(18,0)
    constraints:
    - type: not_null
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
  - name: n_duels
    description: "Duelos válidos con su compañero de equipo (carrera, clasificación y sprint). Nulo si no tuvo ninguno."
    data_type: number(18,0)
  - name: n_races_valid
    description: "Carreras válidas para C3 (excluye averías y no salidas). Nulo si todas fueron por avería."
    data_type: number(18,0)
  - name: is_reliable_sample
    description: "Verdadero si tiene al menos min_valid_races carreras válidas y min_duels duelos (por defecto 8 y 10, configurables en vars). Solo estas filas entran en el cálculo de los z-scores y tienen score."
    data_type: boolean
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: c1_win_rate
    description: "C1: proporción de duelos ganados al compañero de equipo (0 a 1)."
    data_type: number(19,6)
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 1
  - name: c2_incident_rate
    description: "C2: incidentes atribuibles al piloto (accidentes y salidas de pista) por carrera con salida. Más es peor."
    data_type: number(19,6)
    constraints:
    - type: not_null
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 1
  - name: c3_positions_vs_car
    description: "C3: posiciones ganadas respecto al puesto esperado para su coche. Positivo = rinde por encima de su coche."
    data_type: number(38,9)
  - name: z_c1
    description: "C1 estandarizado dentro de su temporada (pasos típicos sobre la media de los pilotos fiables)."
    data_type: float
  - name: z_c2
    description: "C2 estandarizado dentro de su temporada. Se resta en el score."
    data_type: float
  - name: z_c3
    description: "C3 estandarizado dentro de su temporada."
    data_type: float
  - name: score
    description: "Score compuesto (z_c1 - z_c2 + z_c3) / 3, con pesos de 1/3. Nulo si la muestra no es fiable."
    data_type: float
- name: fct_driver_race
  description: "Tabla de hechos con una fila por piloto y carrera (2000-2024): resultado de la carrera, clasificación y sprint de ese fin de semana. Se alimenta de gold_results__enriched."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id_race
        - id_driver
  columns:
  - name: id_driver_race
    description: "Clave de la fila: clave sustituta de carrera y piloto."
    data_tests:
    - unique
    - not_null
  - name: id_race
    description: "Carrera. Apunta a dim_race."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_race')
          field: id_race
  - name: id_driver
    description: "Piloto. Apunta a dim_driver."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_driver')
          field: id_driver
  - name: id_constructor
    description: "Constructor con el que corrió la carrera. Apunta a dim_constructor."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_constructor')
          field: id_constructor
  - name: season_year
    description: '{{ doc("season_year") }}'
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: '{{ var(''season_start'') }}'
          max_value: '{{ var(''season_end'') }}'
  - name: round
    description: '{{ doc("round") }}'
    data_tests:
    - not_null
  - name: quali_position
    description: "Posición en la clasificación. Nulo si no hay clasificación (faltan algunas de 2000-2002)."
  - name: q1_ms
    description: "Mejor tiempo de la Q1 en milisegundos. Nulo si no hay dato."
  - name: q2_ms
    description: "Mejor tiempo de la Q2 en milisegundos. Nulo si no la disputó o es anterior a 2006."
  - name: q3_ms
    description: "Mejor tiempo de la Q3 en milisegundos. Nulo si no la disputó o es anterior a 2006."
  - name: grid
    description: '{{ doc("grid") }}'
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  - name: position_order
    description: "Orden final en la carrera, definido también para los que no terminaron."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
  - name: is_classified
    description: "Verdadero si tiene posición oficial en la carrera."
    data_tests:
    - not_null
  - name: status_category
    description: '{{ doc("status_category") }}'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - finished
          - mechanical
          - driver_incident
          - other_not_finished
          - not_started
  - name: laps
    description: '{{ doc("laps") }}'
  - name: race_time_ms
    description: '{{ doc("race_time_ms") }}'
  - name: points
    description: "Puntos de la carrera."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  - name: sprint_points
    description: "Puntos del sprint. 0 si no hubo sprint."
  - name: total_points
    description: "Puntos de carrera más puntos de sprint."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  - name: sprint_position_order
    description: "Orden final en el sprint. Nulo si no hubo sprint."
- name: dim_driver
  description: "Dimensión de pilotos (2000-2024). Una fila por piloto con sus datos y un resumen de su carrera en el periodo, calculado con las carreras en las que tomó la salida."
  columns:
  - name: id_driver
    description: "Clave del piloto: clave sustituta de su referencia."
    data_tests:
    - unique
    - not_null
  - name: driver_ref
    description: "Referencia corta del piloto en el origen."
    data_tests:
    - unique
    - not_null
  - name: driver_full_name
    description: "Nombre y apellidos."
    data_tests:
    - not_null
  - name: driver_dob
    description: "Fecha de nacimiento."
  - name: driver_code
    description: "Código de tres letras. Nulo en pilotos que no lo tienen."
  - name: driver_nationality
    description: "Nacionalidad."
  - name: first_season_year
    description: "Primera temporada con carrera en 2000-2024."
  - name: last_season_year
    description: "Última temporada con datos en 2000-2024."
  - name: n_seasons
    description: "Temporadas en las que corrió."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
  - name: n_races
    description: "Carreras con salida."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
  - name: n_wins
    description: "Victorias de carrera."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  - name: n_podiums
    description: "Podios en carrera."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
- name: dim_constructor
  description: "Dimensión de constructores (2000-2024). Una fila por constructor con sus datos y un resumen de su participación."
  columns:
  - name: id_constructor
    description: "Clave del constructor: clave sustituta de su referencia."
    data_tests:
    - unique
    - not_null
  - name: constructor_ref
    description: "Referencia corta del constructor en el origen."
    data_tests:
    - unique
    - not_null
  - name: constructor_name
    description: "Nombre del constructor."
    data_tests:
    - not_null
  - name: constructor_nationality
    description: "Nacionalidad."
  - name: first_season_year
    description: "Primera temporada con carrera en 2000-2024."
  - name: last_season_year
    description: "Última temporada con datos en 2000-2024."
  - name: n_seasons
    description: "Temporadas en las que participó."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
  - name: n_wins
    description: "Victorias de carrera de cualquiera de sus pilotos."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
- name: dim_race
  description: "Dimensión de carreras (2000-2024). Una fila por carrera con los datos del circuito incluidos (desnormalizada)."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - season_year
        - round
  columns:
  - name: id_race
    description: "Clave de la carrera: clave sustituta de temporada y ronda."
    data_tests:
    - unique
    - not_null
  - name: season_year
    description: '{{ doc("season_year") }}'
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: '{{ var(''season_start'') }}'
          max_value: '{{ var(''season_end'') }}'
  - name: round
    description: '{{ doc("round") }}'
    data_tests:
    - not_null
  - name: race_name
    description: "Nombre del gran premio."
  - name: race_date
    description: "Fecha de la carrera."
    data_tests:
    - not_null
  - name: has_sprint
    description: "Verdadero si ese fin de semana hubo sprint."
    data_tests:
    - not_null
  - name: circuit_name
    description: "Nombre del circuito."
    data_tests:
    - not_null
  - name: circuit_location
    description: "Localidad del circuito."
  - name: circuit_country
    description: "País del circuito."
  - name: circuit_lat
    description: "Latitud."
  - name: circuit_lng
    description: "Longitud."
  - name: circuit_altitude_m
    description: "Altitud en metros."



unit_tests:

  - name: test_fct_driver_season_score
    description: "Con dos pilotos fiables (A y B) y uno sin muestra fiable (D), comprueba los z-scores, el score (z_c1 - z_c2 + z_c3) / 3 y que D tiene score nulo sin alterar la media de la temporada."
    model: fct_driver_season
    given:
      - input: ref('int_f1__driver_season_c1')
        rows:
          - {id_driver: A, season_year: 2020, n_duels: 20, c1_win_rate: 0.75}
          - {id_driver: B, season_year: 2020, n_duels: 20, c1_win_rate: 0.25}
          - {id_driver: D, season_year: 2020, n_duels: 4,  c1_win_rate: 1.0}
      - input: ref('int_f1__driver_season_c2')
        rows:
          - {id_driver: A, season_year: 2020, n_races: 20, n_incidents: 0,  c2_incident_rate: 0.0}
          - {id_driver: B, season_year: 2020, n_races: 20, n_incidents: 10, c2_incident_rate: 0.5}
          - {id_driver: D, season_year: 2020, n_races: 12, n_incidents: 9,  c2_incident_rate: 0.75}
      - input: ref('int_f1__driver_season_c3')
        rows:
          - {id_driver: A, season_year: 2020, n_races: 18, c3_positions_vs_car: 3}
          - {id_driver: B, season_year: 2020, n_races: 18, c3_positions_vs_car: 1}
          - {id_driver: D, season_year: 2020, n_races: 12, c3_positions_vs_car: 5}
    expect:
      rows:
        - {id_driver: A, season_year: 2020, is_reliable_sample: true,  z_c1: 1, z_c2: -1, z_c3: 1,  score: 1}
        - {id_driver: B, season_year: 2020, is_reliable_sample: true,  z_c1: -1, z_c2: 1, z_c3: -1, score: -1}
        - {id_driver: D, season_year: 2020, is_reliable_sample: false, z_c1: 2, z_c2: 2,  z_c3: 3,  score: null}

  - name: test_fct_driver_season_desviacion_cero
    description: "Con un solo piloto fiable en la temporada la desviación es 0: los z-scores y el score quedan nulos y no hay error de división por cero."
    model: fct_driver_season
    overrides:
      vars:
        min_valid_races: 8
        min_duels: 10
    given:
      - input: ref('int_f1__driver_season_c1')
        rows:
          - {id_driver: A, season_year: 2021, n_duels: 20, c1_win_rate: 0.75}
      - input: ref('int_f1__driver_season_c2')
        rows:
          - {id_driver: A, season_year: 2021, n_races: 20, n_incidents: 0, c2_incident_rate: 0.0}
      - input: ref('int_f1__driver_season_c3')
        rows:
          - {id_driver: A, season_year: 2021, n_races: 18, c3_positions_vs_car: 3}
    expect:
      rows:
        - {id_driver: A, season_year: 2021, is_reliable_sample: true, z_c1: null, z_c2: null, z_c3: null, score: null}