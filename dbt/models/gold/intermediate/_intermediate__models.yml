version: 2

models:
- name: int_f1__driver_season_c1
  description: "C1: duelo con el compañero de equipo. Una fila por piloto y temporada con el porcentaje de duelos ganados (carrera, clasificación y sprint juntos). Los duelos se calculan dentro del propio modelo: cada duelo genera dos filas, una desde cada piloto, y se excluyen averías y no salidas (carrera y sprint) y los pilotos sin tiempo de Q1 en clasificación."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id_driver
        - season_year
  columns:
  - name: id_driver
    description: "Piloto. Apunta a dim_driver."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_driver')
          field: id_driver
  - name: season_year
    description: '{{ doc("season_year") }}'
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: '{{ var(''season_start'') }}'
          max_value: '{{ var(''season_end'') }}'
  - name: n_duels
    description: "Duelos válidos disputados."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
  - name: n_wins
    description: "Duelos ganados."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  - name: c1_win_rate
    description: "Proporción de duelos ganados (0 a 1). Va con signo positivo en el score."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 1
- name: int_f1__driver_season_c2
  description: "C2: incidentes atribuibles al piloto. Una fila por piloto y temporada con la tasa de carreras con salida que acabaron por accidente o salida de pista."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id_driver
        - season_year
  columns:
  - name: id_driver
    description: "Piloto. Apunta a dim_driver."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_driver')
          field: id_driver
  - name: season_year
    description: '{{ doc("season_year") }}'
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: '{{ var(''season_start'') }}'
          max_value: '{{ var(''season_end'') }}'
  - name: n_races
    description: "Carreras en las que tomó la salida (excluye not_started; incluye las que acabó por avería)."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
  - name: n_incidents
    description: "Carreras acabadas con estado driver_incident."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  - name: c2_incident_rate
    description: "Incidentes por carrera con salida. Va con signo negativo en el score: más es peor."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 1
- name: int_f1__driver_season_c3
  description: "C3: rendimiento frente al nivel del coche. Una fila por piloto y temporada con la media de posiciones ganadas respecto al puesto esperado para su coche. El nivel del coche es el puesto del constructor en el campeonato de esa temporada (puntos de carrera más sprint, empates con el mismo puesto)."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id_driver
        - season_year
  columns:
  - name: id_driver
    description: "Piloto. Apunta a dim_driver."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_driver')
          field: id_driver
  - name: season_year
    description: '{{ doc("season_year") }}'
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: '{{ var(''season_start'') }}'
          max_value: '{{ var(''season_end'') }}'
  - name: n_races
    description: "Carreras válidas (excluye averías y no salidas)."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 1
  - name: c3_positions_vs_car
    description: "Media de (puesto esperado para su coche - puesto final). Positivo = rinde por encima de su coche."
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: -25
          max_value: 25
- name: gold_results__enriched
  description: "Modelo ancho: una fila por piloto y carrera (mismo grano que slv_f1__results) con la clasificación y el sprint de ese fin de semana ya unidos. Alimenta a fct_driver_race. Clasificación y sprint pueden ser nulos."
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - id_race
        - id_driver
  columns:
  - name: id_race
    description: "Carrera. Apunta a dim_race."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_race')
          field: id_race
  - name: id_driver
    description: "Piloto. Apunta a dim_driver."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_driver')
          field: id_driver
  - name: id_constructor
    description: "Constructor con el que corrió la carrera. Si cambió de equipo entre clasificación y carrera, manda el de la carrera."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_constructor')
          field: id_constructor
  - name: season_year
    description: '{{ doc("season_year") }}'
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: '{{ var(''season_start'') }}'
          max_value: '{{ var(''season_end'') }}'
  - name: round
    description: '{{ doc("round") }}'
  - name: car_number
    description: "Número de coche en la carrera."
  - name: quali_position
    description: "Posición en la clasificación. Nulo si no hay clasificación."
  - name: q1_ms
    description: "Mejor tiempo de la Q1 en milisegundos."
  - name: q2_ms
    description: "Mejor tiempo de la Q2 en milisegundos. Nulo antes de 2006 o si no la disputó."
  - name: q3_ms
    description: "Mejor tiempo de la Q3 en milisegundos. Nulo antes de 2006 o si no la disputó."
  - name: grid
    description: '{{ doc("grid") }}'
  - name: position
    description: "Posición oficial en la carrera. Nulo si no fue clasificado."
  - name: position_order
    description: "Orden final en la carrera, definido también para los que no terminaron."
    data_tests:
    - not_null
  - name: is_classified
    description: "Verdadero si tiene posición oficial en la carrera."
    data_tests:
    - not_null
  - name: points
    description: "Puntos de la carrera."
  - name: laps
    description: '{{ doc("laps") }}'
  - name: race_time_ms
    description: '{{ doc("race_time_ms") }}'
  - name: status
    description: "Estado final de la carrera en texto."
  - name: status_category
    description: '{{ doc("status_category") }}'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - finished
          - mechanical
          - driver_incident
          - other_not_finished
          - not_started
  - name: sprint_grid
    description: "Posición de salida en el sprint. Nulo si no hubo sprint."
  - name: sprint_position_order
    description: "Orden final en el sprint. Nulo si no hubo sprint."
  - name: sprint_points
    description: "Puntos del sprint. Nulo si no hubo sprint."
  - name: sprint_status_category
    description: "Categoría del estado final en el sprint. Nulo si no hubo sprint."